[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ninja-pce"
version = "0.4.0"
description = "CSPF, topology reconciliation, and approved RSVP-TE config delivery"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ninja-pce contributors" }]
dependencies = [
  "networkx>=3.2",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.9",
  "mypy>=1.13", "types-PyYAML>=6.0", "types-networkx>=3.2",
]
southbound = ["netmiko>=4.3"]
gns3 = ["netmiko>=4.3", "ncclient>=0.6.15", "rich>=13.0"]

[project.scripts]
ninja-pce = "ninja_pce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ninja_pce = ["templates/*.j2", "web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src/ninja_pce"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "netmiko.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires separately supplied lab evidence; never run against production"]
