# Legacy mixed XR/Junos sample; private addresses and admin are lab placeholders.
# This is not the live six-router IOS XE 16.9.7 inventory. Edit values for your
# own qualified images. Preview is default; CLI writes require --execute
# --approve --approved-plan-id plus external credentials and all delivery gates.
# auto-apply is an optional policy tag, not evidence of platform qualification
# or source authority. All delivery commands must share one persistent ledger.

devices:
  PE1:
    role: headend
    tags: [auto-apply, gns3-headend]
    platform: cisco_xr
    management_ip: 172.16.100.101
    username: admin
    password_env: NINJA_PCE_PE1_PASSWORD
    ssh_port: 22
    loopback: 10.255.0.1
    notes: RSVP-TE tunnel head-end for the demo.

  PE3:
    role: tailend
    platform: juniper_junos
    management_ip: 172.16.100.106
    username: admin
    password_env: NINJA_PCE_PE3_PASSWORD
    ssh_port: 22
    loopback: 10.255.0.6
    notes: RSVP-TE tunnel tail-end for the demo.

  P1:
    role: core
    platform: cisco_xr
    management_ip: 172.16.100.102
    username: admin
    password_env: NINJA_PCE_P1_PASSWORD
    ssh_port: 22
    loopback: 10.255.0.2

  P2:
