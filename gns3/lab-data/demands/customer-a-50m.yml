service:
  name: CUSTOMER_A_PE1_PE3_50M
  source: PE1
  destination: PE3
  bandwidth_mbps: 50
  setup_priority: 7
  hold_priority: 7
  description: Customer A protected L2VPN/L3VPN transport demand from PE1 to PE3.

  affinity:
    exclude_admin_groups: []
    include_any_admin_groups: []
    include_all_admin_groups: []

  path:
    hop_type: strict
    max_candidates: 4
    avoid_nodes: []
    avoid_links: []
    include_nodes: []
    max_hops:
    max_metric:

  output:
    dry_run: true
    tunnel_id: 100
    tunnel_name: TUN_CUSTOMER_A_PE1_PE3
    explicit_path_name: EP_CUSTOMER_A_PE1_PE3
    iosxr_interface: tunnel-te100
    junos_lsp_name: lsp-customer-a-pe1-pe3
    junos_primary_path_name: primary-ninja-pce
    write_plan: true
    write_verification: true
    formats:
      - generic
      - iosxr
      - junos
