# Intended offline qualification topology; these values are not router telemetry.
# Target image: Cisco IOS XE 16.9.7, not yet qualified by Ninja-PCE.
metadata:
  name: iosxe-16.9.7-two-router-qualification
  description: >
    Intended PE1-to-PE3 lab addressing and TE settings for offline preview.
    Router capabilities, link state and bandwidth have not been observed.
  units: Mbps
  source: intended-offline-qualification
  source_type: manual-intended-yaml
  observation_status: unobserved
  software_target: Cisco IOS XE 16.9.7
  authoritative: false
  complete: false

nodes:
  - id: PE1
    loopback: 10.255.0.1
    role: PE
    area: 0.0.0.0
  - id: PE3
    loopback: 10.255.0.6
    role: PE
    area: 0.0.0.0

links:
  # Intended transit subnet: 10.0.16.0/29. Interface names need lab inspection.
  # Bandwidth/state below describe the intended scenario, not measured capacity.
  - id: PE1-PE3-1
    from: PE1
    to: PE3
    from_ip: 10.0.16.1
    to_ip: 10.0.16.6
    metric: 10
    reservable_bw_mbps: 100
    reserved_bw_mbps: 0
    bidirectional: true
