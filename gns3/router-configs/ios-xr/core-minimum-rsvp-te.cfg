! IOS XR-style starter only. Apply equivalent RSVP/MPLS/OSPF-TE on P routers.
!
mpls traffic-eng
!
router ospf 100
 mpls traffic-eng router-id Loopback0
 area 0.0.0.0
  mpls traffic-eng
 !
 area 0.0.0.1
  mpls traffic-eng
 !
!
! Repeat on every core-facing link.
interface GigabitEthernet0/0/0/0
 mpls traffic-eng tunnels
 rsvp bandwidth 100000
!
interface GigabitEthernet0/0/0/1
 mpls traffic-eng tunnels
 rsvp bandwidth 100000
!
interface GigabitEthernet0/0/0/2
 mpls traffic-eng tunnels
 rsvp bandwidth 200000
!
