! IOS XR-style starter only. Edit interfaces/OSPF process for your image.
!
mpls traffic-eng
!
router ospf 100
 router-id 10.255.0.1
 mpls traffic-eng router-id Loopback0
 area 0.0.0.0
  mpls traffic-eng
 !
!
interface Loopback0
 ipv4 address 10.255.0.1 255.255.255.255
!
! Repeat on every core-facing interface that should signal RSVP-TE.
interface GigabitEthernet0/0/0/0
 mpls traffic-eng tunnels
 rsvp bandwidth 100000
!
interface GigabitEthernet0/0/0/1
 mpls traffic-eng tunnels
 rsvp bandwidth 200000
!
! The generated tunnel goes here:
!   /outputs/base/TUN_CUSTOMER_A_PE1_PE3_iosxr.txt
