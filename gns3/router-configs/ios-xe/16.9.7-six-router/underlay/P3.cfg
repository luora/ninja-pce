! IOS XE 16.9.7 lab underlay candidate for P3.
! Apply after the reviewed base addressing configuration for this router.
! Assumes GigabitEthernet1 through GigabitEthernet4 are provisioned.
! RSVP pool and single-flow ceiling: 100000 kbps each (100 Mbps lab policy).
! TE administrative weight: 10 per directed core interface.
! Review manually; this candidate does not save the running configuration.
configure terminal
mpls label protocol ldp
mpls ldp router-id Loopback0
mpls traffic-eng tunnels
router ospf 100
 router-id 10.255.0.3
 passive-interface default
 no passive-interface GigabitEthernet2
 no passive-interface GigabitEthernet3
 no passive-interface GigabitEthernet4
 mpls traffic-eng router-id Loopback0
 mpls traffic-eng area 0
 exit
interface Loopback0
 ip ospf 100 area 0
 exit
! P3 Gi2 to PE1 Gi2; stable link ID PE1-P3.
interface GigabitEthernet2
 ip ospf 100 area 0
 ip ospf network point-to-point
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng administrative-weight 10
 ip rsvp bandwidth 100000 100000
 exit
! P3 Gi3 to P4 Gi3; stable link ID P3-P4.
interface GigabitEthernet3
 ip ospf 100 area 0
 ip ospf network point-to-point
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng administrative-weight 10
 ip rsvp bandwidth 100000 100000
 exit
! P3 Gi4 to P1 Gi4; stable link ID P1-P3.
interface GigabitEthernet4
 ip ospf 100 area 0
 ip ospf network point-to-point
 mpls ip
 mpls traffic-eng tunnels
 mpls traffic-eng administrative-weight 10
 ip rsvp bandwidth 100000 100000
 exit
end
