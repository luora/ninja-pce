! P1 exports its OSPF 100 database to the lab controller only.
! Apply after OSPF/MPLS-TE underlay verification. AS 65000 is lab policy.
configure terminal
router ospf 100
 distribute link-state
 exit
router bgp 65000
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 bgp graceful-restart
 no bgp default ipv4-unicast
 neighbor 172.16.100.10 remote-as 65000
 neighbor 172.16.100.10 description NINJA_PCE_BGP_LS_CONSUMER
 neighbor 172.16.100.10 update-source GigabitEthernet3
 neighbor 172.16.100.10 timers 10 30
 address-family link-state link-state
  neighbor 172.16.100.10 activate
 exit-address-family
 exit
end
