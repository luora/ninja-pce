! Additive IOS XE 16.9.7 lab fragment for the existing Tunnel100.
! Requires the underlay and PE1-tunnel100.cfg baseline already applied:
! Tunnel100, destination 10.255.0.6, 50000kbps, priorities 7/7,
! and explicit path EP_CUSTOMER_A_PE1_PE3 at fallback option 10.
! Requires the reviewed controller's Tunnel100-only initial-PCUpd profile.
! Keep the baseline explicit path and all other interface settings.
! This fragment does not delete, shut down or recreate Tunnel100.
configure terminal
mpls traffic-eng pcc peer 172.16.100.10 source 10.255.0.1 delegate-only
mpls traffic-eng pcc report-all
interface Tunnel100
 tunnel mpls traffic-eng path-option 1 dynamic pce address 172.16.100.10
 tunnel mpls traffic-eng path-option 10 explicit name EP_CUSTOMER_A_PE1_PE3
 exit
end
! Any EXEC reoptimization and save are separate reviewed operator actions.
! Verify active path, RSVP reservations and MPLS OAM before saving.
