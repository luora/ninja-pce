! IOS XE 16.9.7 lab: basic identity and addressing stage.
! Assumes four provisioned adapters: GigabitEthernet1 through GigabitEthernet4.
! Intended port mapping; apply manually. Configuration is not saved automatically.
configure terminal
hostname PE3
no ip domain-lookup
service timestamps log datetime msec
line console 0
 logging synchronous
 exit
interface Loopback0
 description ROUTER_ID_PE3
 ip address 10.255.0.6 255.255.255.255
 no shutdown
 exit
interface GigabitEthernet1
 description UNUSED_shutdown
 shutdown
 exit
interface GigabitEthernet2
 description TO_P4_Gi2_LINK_P4-PE3
 ip address 10.0.46.6 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet3
 description UNUSED_shutdown
 shutdown
 exit
interface GigabitEthernet4
 description TO_P2_Gi4_LINK_P2-PE3
 ip address 10.0.56.6 255.255.255.248
 no shutdown
 exit
end
