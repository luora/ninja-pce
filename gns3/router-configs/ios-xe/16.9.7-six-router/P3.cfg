! IOS XE 16.9.7 lab: basic identity and addressing stage.
! Assumes four provisioned adapters: GigabitEthernet1 through GigabitEthernet4.
! Intended port mapping; apply manually. Configuration is not saved automatically.
configure terminal
hostname P3
no ip domain-lookup
service timestamps log datetime msec
line console 0
 logging synchronous
 exit
interface Loopback0
 description ROUTER_ID_P3
 ip address 10.255.0.3 255.255.255.255
 no shutdown
 exit
interface GigabitEthernet1
 description RESERVED_for_parallel_to_PE1_Gi4_LINK_PE1-P3-parallel
 shutdown
 exit
interface GigabitEthernet2
 description TO_PE1_Gi2_LINK_PE1-P3
 ip address 10.0.13.3 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet3
 description TO_P4_Gi3_LINK_P3-P4
 ip address 10.0.34.3 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet4
 description TO_P1_Gi4_LINK_P1-P3
 ip address 10.0.23.3 255.255.255.248
 no shutdown
 exit
end
