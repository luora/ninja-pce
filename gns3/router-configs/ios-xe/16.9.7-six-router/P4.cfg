! IOS XE 16.9.7 lab: basic identity and addressing stage.
! Assumes four provisioned adapters: GigabitEthernet1 through GigabitEthernet4.
! Intended port mapping; apply manually. Configuration is not saved automatically.
configure terminal
hostname P4
no ip domain-lookup
service timestamps log datetime msec
line console 0
 logging synchronous
 exit
interface Loopback0
 description ROUTER_ID_P4
 ip address 10.255.0.4 255.255.255.255
 no shutdown
 exit
interface GigabitEthernet1
 description TO_P2_Gi1_LINK_P2-P4
 ip address 10.0.54.4 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet2
 description TO_PE3_Gi2_LINK_P4-PE3
 ip address 10.0.46.4 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet3
 description TO_P3_Gi3_LINK_P3-P4
 ip address 10.0.34.4 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet4
 description UNUSED_shutdown
 shutdown
 exit
end
