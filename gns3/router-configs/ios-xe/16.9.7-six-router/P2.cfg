! IOS XE 16.9.7 lab: basic identity and addressing stage.
! Assumes four provisioned adapters: GigabitEthernet1 through GigabitEthernet4.
! Intended port mapping; apply manually. Configuration is not saved automatically.
configure terminal
hostname P2
no ip domain-lookup
service timestamps log datetime msec
line console 0
 logging synchronous
 exit
interface Loopback0
 description ROUTER_ID_P2
 ip address 10.255.0.5 255.255.255.255
 no shutdown
 exit
interface GigabitEthernet1
 description TO_P4_Gi1_LINK_P2-P4
 ip address 10.0.54.5 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet2
 description TO_P1_Gi2_LINK_P1-P2
 ip address 10.0.25.5 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet3
 description UNUSED_shutdown
 shutdown
 exit
interface GigabitEthernet4
 description TO_PE3_Gi4_LINK_P2-PE3
 ip address 10.0.56.5 255.255.255.248
 no shutdown
 exit
end
