! IOS XE 16.9.7 lab: basic identity and addressing stage.
! Assumes four provisioned adapters: GigabitEthernet1 through GigabitEthernet4.
! Intended port mapping; apply manually. Configuration is not saved automatically.
configure terminal
hostname PE1
no ip domain-lookup
service timestamps log datetime msec
line console 0
 logging synchronous
 exit
interface Loopback0
 description ROUTER_ID_PE1
 ip address 10.255.0.1 255.255.255.255
 no shutdown
 exit
interface GigabitEthernet1
 description TO_P1_Gi1_LINK_PE1-P1
 ip address 10.0.12.1 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet2
 description TO_P3_Gi2_LINK_PE1-P3
 ip address 10.0.13.1 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet3
 description UNUSED_shutdown
 shutdown
 exit
interface GigabitEthernet4
 description RESERVED_for_parallel_to_P3_Gi1_LINK_PE1-P3-parallel
 shutdown
 exit
end
