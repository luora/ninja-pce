! IOS XE 16.9.7 lab: basic identity and addressing stage.
! Assumes four provisioned adapters: GigabitEthernet1 through GigabitEthernet4.
! Intended port mapping; apply manually. Configuration is not saved automatically.
configure terminal
hostname P1
no ip domain-lookup
service timestamps log datetime msec
line console 0
 logging synchronous
 exit
interface Loopback0
 description ROUTER_ID_P1
 ip address 10.255.0.2 255.255.255.255
 no shutdown
 exit
interface GigabitEthernet1
 description TO_PE1_Gi1_LINK_PE1-P1
 ip address 10.0.12.2 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet2
 description TO_P2_Gi2_LINK_P1-P2
 ip address 10.0.25.2 255.255.255.248
 no shutdown
 exit
interface GigabitEthernet3
 description TO_pce-ninja_ens4_LINK_P1-PCE-MGMT
 ip address 172.16.100.102 255.255.255.0
 no shutdown
 exit
interface GigabitEthernet4
 description TO_P3_Gi4_LINK_P1-P3
 ip address 10.0.23.2 255.255.255.248
 no shutdown
 exit
end
