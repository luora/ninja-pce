! Separate, explicitly reviewed exporter configuration for IOS XE 16.9.7.
! Apply after both-area OSPF/MPLS-TE underlay and router-ID verification.
! AS 65000 / LS instance 0 are lab intent; compare with actual BGP-LS descriptors.
! The controller initiates the session; P2 only accepts this configured peer.
! This fragment does not alter authentication, firewall rules or tunnel config.
configure terminal
router ospf 100
 ! Omitting the optional instance-id selects the default LS instance zero.
 distribute link-state
 exit
router bgp 65000
 bgp router-id 10.255.0.5
 bgp log-neighbor-changes
 bgp graceful-restart
 no bgp default ipv4-unicast
 neighbor 172.16.100.10 remote-as 65000
 neighbor 172.16.100.10 description NINJA_PCE_MULTI_AREA_BGP_LS_CONSUMER
 neighbor 172.16.100.10 update-source Loopback0
 neighbor 172.16.100.10 transport connection-mode passive
 neighbor 172.16.100.10 timers 10 30
 address-family link-state link-state
  neighbor 172.16.100.10 activate
 exit-address-family
 exit
end
