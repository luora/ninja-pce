# Include in the existing TLS server only AFTER configuration qualification.
# Inherit that server's auth_basic and auth_basic_user_file. The API independently
# rejects every authenticated username absent from its exact operators list.
# GET options also issues/reuses the principal-bound session cookie and CSRF
# token. There is no separate session endpoint or public teardown route.
location = /api/tunnel-options {
    if ($request_method != GET) { return 405; }
    include /etc/nginx/snippets/ninja-provisioning-proxy.conf;
}

location ~ "^/api/tunnel-operations/[0-9a-f]{32}$" {
    if ($request_method != GET) { return 405; }
    include /etc/nginx/snippets/ninja-provisioning-proxy.conf;
}

location = /api/tunnel-plans {
    if ($request_method != POST) { return 405; }
    client_max_body_size 1k;
    include /etc/nginx/snippets/ninja-provisioning-proxy.conf;
}

location = /api/tunnels {
    if ($request_method != POST) { return 405; }
    client_max_body_size 1k;
    include /etc/nginx/snippets/ninja-provisioning-proxy.conf;
}
