# Install as /etc/systemd/system/ninja-pcep.service.d/10-compute.conf.
# Explicit isolated-lab policy: PE1 may request initial paths for Tunnel100.
[Service]
ExecStart=
ExecStart=/home/ubuntu/ninja-pce/.venv/bin/ninja-pce pcep-listen --listen-host 172.16.100.10 --allow-peer 10.255.0.1 --allow-peer 172.16.100.102 --capture /home/ubuntu/ninja-pce/build/live/pcep.json --compute-bgpls-raw /home/ubuntu/ninja-pce/build/live/bgpls-raw.json --compute-bgpls-status /home/ubuntu/ninja-pce/build/live/bgpls-status.json --compute-topology /home/ubuntu/ninja-pce/build/live/topology.json --compute-bgpls-peer 172.16.100.102 --compute-node-map /home/ubuntu/ninja-pce/gns3/controller/ubuntu-24.04/node-map.json --compute-headend 10.255.0.1=10.255.0.1 --compute-delegated-tunnel 10.255.0.1=100
