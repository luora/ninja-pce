# Optional isolated-lab override; install after the reviewed recovery code.
# Install as /etc/systemd/system/ninja-pcep.service.d/20-failover.conf.
# PE1 Tunnel100 only. Initial paths remain enabled; healthy paths are retained.
[Service]
ExecStart=
ExecStart=/home/ubuntu/ninja-pce/.venv/bin/ninja-pce pcep-listen --listen-host 172.16.100.10 --allow-peer 10.255.0.1 --allow-peer 172.16.100.102 --capture /home/ubuntu/ninja-pce/build/live/pcep.json --compute-bgpls-raw /home/ubuntu/ninja-pce/build/live/bgpls-raw.json --compute-bgpls-status /home/ubuntu/ninja-pce/build/live/bgpls-status.json --compute-topology /home/ubuntu/ninja-pce/build/live/topology.json --compute-bgpls-peer 172.16.100.102 --compute-node-map /home/ubuntu/ninja-pce/gns3/controller/ubuntu-24.04/node-map.json --compute-headend 10.255.0.1=10.255.0.1 --compute-delegated-tunnel 10.255.0.1=100 --failover-tunnel 10.255.0.1=100 --failover-state /home/ubuntu/ninja-pce/build/state/pcep-failure-recovery.json
