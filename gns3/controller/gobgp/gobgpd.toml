# Isolated lab candidate. P1 must actually support and export BGP-LS.
# The AS/router ID are operator intent, not observations from the router.
[global.config]
  as = 65000
  router-id = "172.16.100.10"
  port = 179
  local-address-list = ["172.16.100.10"]

[global.apply-policy.config]
  default-import-policy = "accept-route"
  default-export-policy = "reject-route"

[[neighbors]]
  [neighbors.config]
    neighbor-address = "172.16.100.102"
    peer-as = 65000
    description = "P1 trusted BGP-LS producer, isolated lab"
  [neighbors.transport.config]
    local-address = "172.16.100.10"
  [neighbors.timers.config]
    hold-time = 30
    keepalive-interval = 10
  [neighbors.graceful-restart.config]
    # Negotiate GR/EOR; the consumer refuses all restarting/stale states.
    enabled = true
    helper-only = true
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ls"
    [neighbors.afi-safis.mp-graceful-restart.config]
      enabled = true
  [neighbors.apply-policy.config]
    default-import-policy = "accept-route"
    default-export-policy = "reject-route"
