metadata:
  name: simple-multiarea-rsvp-te-lab
  description: >
    Sample TED for ninja-pce. The shortest IGP path from PE1 to PE3
    is PE1-P1-P2-PE3, but link P1-P2 has only 20 Mbps available.
    A 50 Mbps demand should therefore use PE1-P3-P4-PE3 unless constraints
    force a different feasible path.
  units: Mbps
  source_type: manual-yaml
  future_sources:
    - frr-bgp-ls
    - exabgp-json
    - parsed-router-cli

nodes:
  - id: PE1
    loopback: 10.255.0.1
    role: PE
    area: 0.0.0.0
    tags: [headend, iosxr]
  - id: P1
    loopback: 10.255.0.2
    role: P
    area: 0.0.0.0
  - id: P3
    loopback: 10.255.0.3
    role: P
    area: 0.0.0.1
  - id: P4
    loopback: 10.255.0.4
    role: P
    area: 0.0.0.1
  - id: P2
    loopback: 10.255.0.5
    role: P
    area: 0.0.0.0
  - id: PE3
    loopback: 10.255.0.6
    role: PE
    area: 0.0.0.1
    tags: [tailend, junos]

links:
  - id: PE1-P1
    from: PE1
    to: P1
    from_ip: 10.0.12.1
    to_ip: 10.0.12.2
    metric: 10
    reservable_bw_mbps: 100
    reserved_bw_mbps: 10
    admin_groups: [BLUE]
    srlg: [metro-a]
    area: 0.0.0.0
    protection: unprotected
    bidirectional: true

  - id: P1-P2
    from: P1
    to: P2
    from_ip: 10.0.25.2
    to_ip: 10.0.25.5
    metric: 10
    reservable_bw_mbps: 100
    reserved_bw_mbps: 80
    admin_groups: [BLUE]
    srlg: [metro-a]
    area: 0.0.0.0
    protection: unprotected
    bidirectional: true

  - id: P2-PE3
    from: P2
    to: PE3
    from_ip: 10.0.56.5
    to_ip: 10.0.56.6
    metric: 10
    reservable_bw_mbps: 100
    reserved_bw_mbps: 10
    admin_groups: [BLUE]
    srlg: [metro-b]
    area: 0.0.0.1
    protection: link-protected
    bidirectional: true

  - id: PE1-P3
    from: PE1
