name: deterministic-validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests tools gns3/validation
      - run: mypy
      - run: pytest --cov=ninja_pce --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install build setuptools wheel
      - run: python tools/build_distribution.py --download-dependencies
      - name: Verify offline installation outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/ninja-pce-package-test
          /tmp/ninja-pce-package-test/bin/python -m pip install --no-index --find-links dist/wheelhouse dist/*.whl
          cd /tmp
          /tmp/ninja-pce-package-test/bin/ninja-pce --version
          /tmp/ninja-pce-package-test/bin/ninja-pce controller --help
          /tmp/ninja-pce-package-test/bin/python -c 'from importlib.resources import files; p = files("ninja_pce"); assert p.joinpath("data/gobgp-readonly.proto").is_file(); assert p.joinpath("web/index.html").is_file(); assert p.joinpath("templates/iosxe_rsvp_te.j2").is_file()'
      - uses: actions/upload-artifact@v4
        with:
          name: ninja-pce-distribution
          path: dist/
