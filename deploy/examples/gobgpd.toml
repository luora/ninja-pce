# Example only: replace all addresses and AS values for your routing domain.
# Run GoBGP independently; the ninja-controller unit does not install or start it.
# Bind the GoBGP gRPC API to 127.0.0.1:50051 when launching gobgpd.
[global.config]
  as = 65000
  router-id = "10.201.0.10"
  port = 179
  local-address-list = ["10.201.0.10"]

[global.apply-policy.config]
  default-import-policy = "accept-route"
  default-export-policy = "reject-route"

[[neighbors]]
  [neighbors.config]
    neighbor-address = "10.201.0.1"
    peer-as = 65000
    description = "Managed domain BGP-LS exporter"
  [neighbors.transport.config]
    local-address = "10.201.0.10"
  [neighbors.timers.config]
    hold-time = 30
    keepalive-interval = 10
  [neighbors.graceful-restart.config]
    enabled = true
    helper-only = true
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ls"
    [neighbors.afi-safis.mp-graceful-restart.config]
      enabled = true
  [neighbors.apply-policy.config]
    default-import-policy = "accept-route"
    default-export-policy = "reject-route"
